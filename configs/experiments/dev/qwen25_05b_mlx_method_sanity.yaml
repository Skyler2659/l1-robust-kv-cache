experiment_name: qwen25_05b_mlx_method_sanity
model:
  name: mlx-community/Qwen2.5-0.5B-Instruct-4bit
  family: qwen
  backend: mlx
  dtype: auto
  device: mps
  quant_bits: 4
  quant_group_size: 64
  mlx_weight_quantize: false
  prefill_step_size: 512
  trust_remote_code: false
  local_files_only: false
  prompt_format:
    mode: plain
    system_prompt: null
eviction:
  method: recency
  cache_size: 64
  sink_size: 4
  recent_size: 24
  score_source: v
  sketch_dim: 128
  update_interval: 32
  update_policy: every_n_steps
  score_normalization: rank
  observation_window: 32
  window_size: 32
  attention_window: 32
  pooling_kernel: 5
  pooling_method: avgpool
  pyramid_mode: funnel
  hybrid_mode: budget_split
  lambda_attn: 0.5
  attn_budget_ratio: 0.3
  l1_budget_ratio: 0.3
  recent_budget_ratio: 0.3
  sink_budget_ratio: 0.1
  compactor_sketch_dim: 32
  compactor_chunk_size: 128
  compactor_attention_chunk_size: 64
  seed: 42
benchmark:
  name: niah
  depths: [0.5]
  max_words: 80
  needles_per_depth: 1
  context_length: 384
  max_steps: 384
  max_new_tokens: 16
  num_samples: 1
  eval_target_only: true
  use_synthetic_haystack: true
  haystack_repeats: 20
analysis:
  overlap: true
  rank_correlation: true
  evidence_recall: true
  case_study: true
  case_study_count: 1
  include_oracle: false
methods:
  - full
  - random
  - recency
  - sink_recent
  - attention
  - snapkv
  - compactor
  - pyramidkv
  - l2_prefill_only
  - l2_key_prefill_only
  - l2_leverage
  - l1_prefill_only
  - l1_leverage
  - attention_l2
  - attention_l1
cache_budgets: [64]
output_dir: /tmp/l1_robust_kv_cache_smoke
save_selected_tokens: true
save_scores: true
save_prompt_text: true
progress_every: 20
seed: 42
overwrite: false
