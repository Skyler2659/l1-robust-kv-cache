experiment_name: ruler_vt_diag_qwen25_7b_8methods
model:
  name: mlx-community/Qwen2.5-7B-Instruct-4bit
  family: qwen
  backend: mlx
  dtype: auto
  device: mps
  quant_bits: 4
  quant_group_size: 64
  mlx_weight_quantize: false
  prefill_step_size: 32768
  trust_remote_code: false
  local_files_only: false
  prompt_format:
    mode: plain
    system_prompt: null
eviction:
  method: full
  cache_size: 256
  sink_size: 4
  recent_size: 64
  score_source: v
  sketch_dim: 1024
  update_interval: 32
  update_policy: every_n_steps
  score_normalization: rank
  observation_window: 64
  window_size: 64
  pooling_kernel: 5
  pooling_method: avgpool
  pyramid_mode: funnel
  hybrid_mode: budget_split
  lambda_attn: 0.5
  attn_budget_ratio: 0.3
  l1_budget_ratio: 0.3
  recent_budget_ratio: 0.3
  sink_budget_ratio: 0.1
  seed: 42
benchmark:
  name: ruler
  tasks:
    - vt
  use_official_dataset: true
  require_official_dataset: true
  hf_dataset_name: xAlg-AI/att-hub-ruler-16k
  n_samples_per_task: 10
  num_samples: 10
  max_steps: 32768
  max_new_tokens: 30
  eval_target_only: true
  evaluation: official
methods:
  - full
  - attention
  - snapkv
  - compactor
  - l1_prefill_only
  - l2_prefill_only
  - attention_l1
  - attention_l2
cache_budgets:
  - 256
  - 512
  - 1024
analysis:
  overlap: true
  rank_correlation: false
  evidence_recall: false
  case_study: true
  case_study_count: 10
  include_oracle: false
output_dir: results
save_selected_tokens: true
save_scores: true
save_prompt_text: true
progress_every: 50
seed: 42
overwrite: false
